<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SVB brand sheet</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #faf7f2; color: #222; }
  section { padding: 20px 28px; border-bottom: 1px solid #0002; }
  h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #666; }
  .row { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .cell { text-align: center; }
  .cell small { display: block; color: #888; margin-top: 6px; }
  .dark { background: #201a1c; color: #eee; }
  img { display: block; }
</style>
</head>
<body>
<section>
  <h2>v1 · badge 64 · glyph claro / oscuro</h2>
  <div class="row">
    <div class="cell"><img src="logo.svg?v=6" width="128" height="128"><small>128</small></div>
    <div class="cell"><img src="logo.svg?v=6" width="64" height="64"><small>64</small></div>
    <div class="cell"><img src="logo.svg?v=6" width="32" height="32"><small>32</small></div>
    <div class="cell"><img src="logo.svg?v=6" width="16" height="16"><small>16</small></div>
  </div>
</section>
<section class="dark">
  <h2>sobre oscuro (glyph crema directo, sin badge)</h2>
  <div class="row">
    <div class="cell"><img src="glyph-cream.svg?v=6" width="128" height="128"><small>128</small></div>
    <div class="cell"><img src="glyph-cream.svg?v=6" width="48" height="48"><small>48</small></div>
  </div>
</section>
<section>
  <h2>sobre claro (glyph tinta)</h2>
  <div class="row">
    <div class="cell"><img src="glyph-ink.svg?v=6" width="128" height="128"><small>128</small></div>
    <div class="cell"><img src="glyph-ink.svg?v=6" width="48" height="48"><small>48</small></div>
  </div>
</section>
</body>
</html>
